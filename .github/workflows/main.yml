name: Create Module Files for GitHub Release

env:
  project_url: "https://github.com/${{github.repository}}"
  latest_manifest_url: "https://github.com/${{github.repository}}/releases/latest/download/module.json"
  release_module_url: "https://github.com/${{github.repository}}/releases/download/${{github.event.release.tag_name || github.ref_name}}/module.zip"
  changelog_url: "https://github.com/${{github.repository}}/releases/tag/${{github.event.release.tag_name || github.ref_name}}"

on:
  release:
    types: [published]
  # Pushing a version tag (e.g. v2.3.0) also builds and publishes a release
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version from Tag
        id: get_version
        uses: battila7/get-version-action@v2

      - run: echo "$OUTPUTS"
        shell: bash
        env:
         OUTPUTS: ${{ toJSON(steps.get_version.outputs) }}

      - name: Modify Manifest with Release-Specific Values
        id: sub_manifest_link_version
        uses: cschleiden/replace-tokens@v1
        with:
          files: 'module.json'
        env:
          VERSION: ${{steps.get_version.outputs.version-without-v}}
          URL: ${{env.project_url}}
          MANIFEST: ${{env.latest_manifest_url}}
          DOWNLOAD: ${{env.release_module_url}}
          CHANGELOG: ${{env.changelog_url}}

      - name: "Install Node"
        uses: actions/setup-node@v2
        with:
          node-version: 24

      - name: "Install Dependencies"
        run: npm ci

      - name: "Compile Packs"
        run: npm run compile
      
      - name: Create Archive
        run: |
          zip --recurse-paths \
          ./module.zip        \
          lang                \
          packs               \
          scripts             \
          styles              \
          templates           \
          LICENSE             \
          module.json

      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{github.event.release.name || github.ref_name}}
          draft: ${{github.event.release.draft || false}}
          prerelease: ${{github.event.release.prerelease || false}}
          token: ${{secrets.GITHUB_TOKEN}}
          artifacts: './module.json, ./module.zip'
          tag: ${{github.event.release.tag_name || github.ref_name}}
          body: ${{github.event.release.body}}
          generateReleaseNotes: ${{github.event_name == 'push'}}
